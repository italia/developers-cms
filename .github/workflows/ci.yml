name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Si annullano solo le run di PR. Su main e sui tag NO: la run contiene un
  # `helm upgrade`, e annullarla a metà lascia la release in `pending-upgrade`,
  # per cui ogni deploy successivo fallisce con "another operation
  # (install/upgrade/rollback) is in progress" finché qualcuno non esegue a mano
  # `helm rollback <release> <ultima-revisione-deployed> -n <ns>`.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # italia/developers-cms
  CHART_PATH: deploy/helm/developers-cms
  CHART_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  # ── Test applicativi: integrazione (Payload Local API su Postgres) ──────────
  test:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: developers_cms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/developers_cms_test
      PAYLOAD_SECRET: ci-test-secret
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'
      - run: bun install --frozen-lockfile
      - name: Run integration tests
        run: bun run test:int

  # ── Test applicativi: end-to-end (Playwright sull'admin Payload) ────────────
  e2e:
    name: E2E tests
    # Playwright 1.58 non supporta ancora chromium su ubuntu 26.04 (ubuntu-latest)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: developers_cms_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/developers_cms_e2e
      PAYLOAD_SECRET: ci-e2e-secret
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'
      - run: bun install --frozen-lockfile
      - name: Install Playwright (chromium)
        run: bunx playwright install --with-deps chromium
      - name: Start app (dev) in background
        run: |
          nohup bun run dev > dev-server.log 2>&1 &
          echo "Attendo l'avvio su http://localhost:3000 ..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/access >/dev/null 2>&1; then
              echo "App pronta"; exit 0
            fi
            sleep 3
          done
          echo "Timeout avvio app"; cat dev-server.log; exit 1
      - name: Run E2E tests
        run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            dev-server.log
          retention-days: 7

  # ── Build immagine container e push su GHCR ─────────────────────────────────
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Lint, package e push del chart Helm su GHCR (OCI) ───────────────────────
  helm:
    name: Package & push Helm chart
    runs-on: ubuntu-latest
    needs: [build-push]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      chart-version: ${{ steps.ver.outputs.chart }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Lint chart
        run: |
          helm lint "$CHART_PATH" \
            --set app.databaseUrl=postgres://u:p@db:5432/x \
            --set app.payloadSecret=dummy
      - name: Compute versions
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            CHART_VERSION="${GITHUB_REF#refs/tags/v}"
            APP_VERSION="${GITHUB_REF#refs/tags/v}"
          else
            CHART_VERSION="0.1.0-main.${GITHUB_SHA::7}"
            APP_VERSION="sha-${GITHUB_SHA}"
          fi
          echo "chart=$CHART_VERSION" >> "$GITHUB_OUTPUT"
          echo "app=$APP_VERSION" >> "$GITHUB_OUTPUT"
      - name: Helm registry login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Package & push
        run: |
          helm package "$CHART_PATH" \
            --version "${{ steps.ver.outputs.chart }}" \
            --app-version "${{ steps.ver.outputs.app }}"
          helm push "developers-cms-${{ steps.ver.outputs.chart }}.tgz" "$CHART_REGISTRY"

  # ── Deploy test (push su main → ns developers-cms-test) ─────────────────────
  # Ogni merge su main va live su test con l'immagine `sha-<commit>`. La CI
  # cambia solo l'immagine: i values dell'ambiente stanno in k8s-configuration
  # (helm/developers-cms/test/values.yaml) e restano quelli dell'ultimo deploy
  # manuale. --reset-then-reuse-values, non --reuse-values: il secondo riusa i
  # valori *calcolati* della release precedente, quindi i default nuovi del
  # chart non arriverebbero mai in cluster. Così si parte dai default del chart
  # e sopra si riapplicano i values impostati a mano sulla release.
  # Solo `upgrade`, mai `--install`: senza i values dell'ambiente il chart
  # partirebbe senza DATABASE_URL né PAYLOAD_SECRET.
  # Credenziali: ServiceAccount gh-deployer, ruolo `admin` sul solo namespace
  # (k8s-configuration/manifests/developers-cms-rbac-ci.yaml).
  deploy-test:
    name: Deploy to test
    runs-on: ubuntu-latest
    # Largo apposta: `helm upgrade` ha già il suo --timeout=10m e con --atomic
    # può aggiungerci un rollback. Troncarlo a metà lascerebbe la release in
    # `pending-upgrade` (vedi la concurrency in testa).
    timeout-minutes: 30
    needs: [build-push, helm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: test
      url: https://cms-test.developers.italia.it
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      KUBECONFIG: ${{ github.workspace }}/.kubeconfig
      NAMESPACE: developers-cms-test
      RELEASE: developers-cms-test
    steps:
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - uses: azure/setup-kubectl@v4
      - name: Write kubeconfig
        run: |
          umask 077
          printf '%s' "$KUBECONFIG_DATA" > "$KUBECONFIG"
          kubectl auth whoami
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DEVELOPERS_CMS_TEST }}
      - name: Helm registry login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      # Il job migrate (hook pre-upgrade) esegue `payload migrate` sul DB di
      # test: se fallisce, l'upgrade si ferma prima di toccare il Deployment.
      - name: Deploy
        run: |
          helm upgrade "$RELEASE" "$CHART_REGISTRY/developers-cms" \
            --version "${{ needs.helm.outputs.chart-version }}" \
            --namespace "$NAMESPACE" \
            --reset-then-reuse-values \
            --set-string "app.image.tag=sha-${GITHUB_SHA}" \
            --wait --timeout=10m --atomic
      - name: Verify
        run: |
          kubectl rollout status "deployment/$RELEASE" -n "$NAMESPACE" --timeout=5m
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors \
            https://cms-test.developers.italia.it/api/access -o /dev/null
          echo "Deploy di ${GITHUB_SHA} su test completato"

  # ── Deploy produzione (tag v* → ns developers-cms) ──────────────────────────
  # Stesso meccanismo di deploy-test, con l'immagine semver del tag (v1.2.3 →
  # 1.2.3). È gated dai test: build-push dipende da integration ed E2E.
  deploy-prod:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-push, helm]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://cms.developers.italia.it
    # Due tag ravvicinati non devono fare upgrade in parallelo sulla stessa release.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      KUBECONFIG: ${{ github.workspace }}/.kubeconfig
      NAMESPACE: developers-cms
      RELEASE: developers-cms
    steps:
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - uses: azure/setup-kubectl@v4
      - name: Write kubeconfig
        run: |
          umask 077
          printf '%s' "$KUBECONFIG_DATA" > "$KUBECONFIG"
          kubectl auth whoami
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DEVELOPERS_CMS }}
      - name: Helm registry login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      # ⚠️ Il job migrate (hook pre-upgrade) esegue `payload migrate` sul DB di
      # PRODUZIONE. Se fallisce, l'upgrade si ferma prima di toccare il Deployment.
      - name: Deploy
        run: |
          helm upgrade "$RELEASE" "$CHART_REGISTRY/developers-cms" \
            --version "${{ needs.helm.outputs.chart-version }}" \
            --namespace "$NAMESPACE" \
            --reset-then-reuse-values \
            --set-string "app.image.tag=${GITHUB_REF_NAME#v}" \
            --wait --timeout=10m --atomic
      - name: Verify
        run: |
          kubectl rollout status "deployment/$RELEASE" -n "$NAMESPACE" --timeout=5m
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors \
            https://cms.developers.italia.it/api/access -o /dev/null
          echo "Deploy di ${GITHUB_REF_NAME} in produzione completato"
