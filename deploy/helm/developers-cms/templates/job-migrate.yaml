{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dcms.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "dcms.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "dcms.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          env:
            - name: NODE_ENV
              value: "production"
          envFrom:
            - secretRef:
                name: {{ include "dcms.secretName" . }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              {{- if .Values.migrate.waitForTcp.enabled }}
              echo "Attendo TCP {{ .Values.migrate.waitForTcp.host }}:{{ .Values.migrate.waitForTcp.port }}..."
              i=0
              until node -e "require('net').connect({host:'{{ .Values.migrate.waitForTcp.host }}',port:{{ .Values.migrate.waitForTcp.port }}},()=>process.exit(0)).on('error',()=>process.exit(1))" 2>/dev/null; do
                i=$((i+1))
                if [ "$i" -ge "{{ .Values.migrate.waitForTcp.attempts }}" ]; then echo "DB non raggiungibile, timeout"; exit 1; fi
                sleep {{ .Values.migrate.waitForTcp.intervalSeconds }}
              done
              echo "DB raggiungibile"
              {{- end }}
              {{ join " " .Values.migrate.command }}
              {{- if .Values.migrate.verify }}
              # `payload migrate` puo' uscire con 0 senza aver migrato niente: la CLI
              # avvia tutto con `void start()`, e se una promise resta appesa Node
              # termina in silenzio con exit 0. E' successo in prod con la 1.0.7
              # (13/11/2026): Job "Completed" in 25s senza output, app nuova su schema
              # vecchio. Qui si controlla che ogni file di src/migrations sia
              # registrato in payload_migrations; se no exit 1, il Job riprova
              # (backoffLimit) e alla fine --atomic lascia il Deployment com'era.
              node - <<'VERIFY'
              process.exitCode = 1
              const fs = require('fs')
              const { Client } = require('pg')
              const dir = process.env.MIGRATIONS_DIR || 'src/migrations'
              const expected = fs.readdirSync(dir).filter((f) => /^\d{8}_\d{6}_.+\.ts$/.test(f)).map((f) => f.slice(0, -3))
              const c = new Client({ connectionString: process.env.DATABASE_URL })
              c.connect()
                .then(() => c.query('select name from payload_migrations'))
                .then((r) => {
                  const done = new Set(r.rows.map((x) => x.name))
                  const missing = expected.filter((n) => !done.has(n))
                  if (missing.length) {
                    console.error('Migration NON applicate: ' + missing.join(', '))
                  } else {
                    console.log('Migration verificate: ' + expected.length + '/' + expected.length + ' registrate nel DB')
                    process.exitCode = 0
                  }
                  return c.end()
                })
                .catch((e) => { console.error(e); return c.end().catch(() => {}) })
              VERIFY
              {{- end }}
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
{{- end }}
