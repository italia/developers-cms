{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dcms.fullname" . }}-env
  labels:
    {{- include "dcms.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  DATABASE_URL: {{ include "dcms.databaseUrl" . | quote }}
  PAYLOAD_SECRET: {{ include "dcms.payloadSecret" . | quote }}
{{- with .Values.app.email }}
{{- if .smtpHost }}
  SMTP_HOST: {{ .smtpHost | quote }}
  SMTP_PORT: {{ .smtpPort | default 587 | quote }}
  SMTP_USER: {{ .smtpUser | quote }}
  SMTP_PASSWORD: {{ .smtpPassword | quote }}
  EMAIL_FROM_ADDRESS: {{ .fromAddress | quote }}
  EMAIL_FROM_NAME: {{ .fromName | quote }}
{{- end }}
{{- end }}
{{- end }}
